<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact Golden Career Consuling Institute</title>
    <meta
      name="description"
      content="Contact Golden Career Consuling Institute for free counselling sessions and queries about streams and colleges."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header container">
      <a class="logo" href="index.html">
        <img
          alt="Golden Career Consuling Institute"
          src="assets/logo.png"
          aria-hidden="true"
        />
        <strong>Golden Career </strong>
        Consuling Institute
      </a>
      <button id="navToggle" aria-label="Open menu" aria-expanded="false">
        ☰
      </button>
      <nav id="mainNav" class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About us</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact us</a>
      </nav>
    </header>

    <!-- Floating Contact Section -->
    <div class="floating-contact">
      <a
        href="tel:+919876543210"
        class="floating-contact-btn phone"
        aria-label="Call us"
      >
        <span class="contact-icon">☎</span>
        <span class="contact-text">Contact us</span>
      </a>
      <a
        href="https://wa.me/919876543210"
        target="_blank"
        class="floating-contact-btn whatsapp"
        aria-label="Contact us on WhatsApp"
      >
        <span class="contact-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            ></path>
            <circle cx="9" cy="10" r="1"></circle>
            <circle cx="12" cy="10" r="1"></circle>
            <circle cx="15" cy="10" r="1"></circle>
          </svg>
        </span>
        <span class="contact-text">Contact on Whats App</span>
      </a>
    </div>

    <main class="container">
      <section class="hero" aria-labelledby="contactTitle">
        <div>
          <h1 id="contactTitle">Get in touch</h1>
          <p class="small">
            Fill the form and we will respond within 24 hours. For urgent
            queries call +91-XXXXXXXXXX.
          </p>
        </div>
        <div class="center" aria-hidden="true"></div>
      </section>

      <section style="margin-top: 12px">
        <div class="card">
          <form id="contactForm" novalidate>
            <div class="form-row">
              <label class="small">Full name</label>
              <input
                name="name"
                type="text"
                placeholder="Your full name"
                required
              />
            </div>

            <div class="row" style="gap: 12px">
              <div style="flex: 1" class="form-row">
                <label class="small">Class</label>
                <select name="class" required>
                  <option value="">Select</option>
                  <option value="10">Class 10</option>
                  <option value="12">Class 12</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div style="flex: 1" class="form-row">
                <label class="small">Board</label>
                <select name="board" required>
                  <option value="">Select</option>
                  <option>CBSE</option>
                  <option>ICSE</option>
                  <option>State Board</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <label class="small">Phone or Email</label>
              <input
                name="contact"
                type="text"
                placeholder="Phone number or email"
                required
              />
            </div>

            <div class="form-row">
              <label class="small">Message</label>
              <textarea
                name="message"
                placeholder="Tell us about your interests or questions"
                required
              ></textarea>
            </div>

            <div id="formFeedback" class="small" style="display: none"></div>

            <div style="margin-top: 12px">
              <button class="btn" type="submit">Send request</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="small">Back to <a href="index.html">Home</a></div>
      <div class="small">© Golden Career Consuling Institute 2026</div>
    </footer>

    <script src="js/main.js" defer></script>
  </body>
</html>
