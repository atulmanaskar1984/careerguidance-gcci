<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact Golden Career Consuling Institute</title>
    <meta
      name="description"
      content="Contact Golden Career Consuling Institute for free counselling sessions and queries about streams and colleges."
    />
    <link rel="stylesheet" href="css/style.css?v=2" />
  </head>
  <body>
    <div id="header"></div>
    <div id="contact-floating"></div>

    <main class="container">
      <section class="hero" aria-labelledby="contactTitle">
        <div>
          <h1 id="contactTitle">Get in touch</h1>
          <p class="small">
            Fill the form and we will respond within 24 hours. For urgent
            queries call +91-XXXXXXXXXX.
          </p>
        </div>
        <div class="center" aria-hidden="true"></div>
      </section>

      <section style="margin-top: 12px">
        <div class="card">
          <form id="contactForm" novalidate>
            <div class="form-row">
              <label class="small">Full name</label>
              <input
                name="name"
                type="text"
                placeholder="Your full name"
                required
              />
            </div>

            <div class="row" style="gap: 12px">
              <div style="flex: 1" class="form-row">
                <label class="small">Class</label>
                <select name="class" required>
                  <option value="">Select</option>
                  <option value="10">Class 10</option>
                  <option value="12">Class 12</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div style="flex: 1" class="form-row">
                <label class="small">Board</label>
                <select name="board" required>
                  <option value="">Select</option>
                  <option>CBSE</option>
                  <option>ICSE</option>
                  <option>State Board</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <label class="small">Phone or Email</label>
              <input
                name="contact"
                type="text"
                placeholder="Phone number or email"
                required
              />
            </div>

            <div class="form-row">
              <label class="small">Message</label>
              <textarea
                name="message"
                placeholder="Tell us about your interests or questions"
                required
              ></textarea>
            </div>

            <div class="form-row" style="margin-top: 12px; display: flex; align-items: flex-start; gap: 8px;">
              <input type="checkbox" id="privacyConsent" name="privacyConsent" required style="margin-top: 4px;" />
              <label for="privacyConsent" class="small" style="margin-bottom: 0; line-height: 1.4;">
                I agree to the <a href="privacy.html" target="_blank" style="text-decoration: underline; color: inherit;">Privacy Notice and Terms of Use</a> and consent to the processing of my personal information to respond to my inquiry.
              </label>
            </div>

            <div id="formFeedback" class="small" style="display: none"></div>

            <div style="margin-top: 12px">
              <button id="submitBtn" class="btn" type="submit" disabled>Send request</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="js/include.js"></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
