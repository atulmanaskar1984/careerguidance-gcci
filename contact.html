<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact Golden Career Consuling Institute</title>
    <meta
      name="description"
      content="Contact Golden Career Consuling Institute for free counselling sessions and queries about streams and colleges."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header container">
      <a class="logo" href="index.html">
        <img
          alt="Golden Career Consuling Institute"
          src="assets/logo.png"
          aria-hidden="true"
        />
        <strong>Golden Career </strong>
        Consuling Institute
      </a>
      <button id="navToggle" aria-label="Open menu" aria-expanded="false">
        ☰
      </button>
      <nav id="mainNav" class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About us</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact us</a>
      </nav>
    </header>

    <main class="container">
      <section class="hero" aria-labelledby="contactTitle">
        <div>
          <h1 id="contactTitle">Get in touch</h1>
          <p class="small">
            Fill the form and we will respond within 24 hours. For urgent
            queries call +91-XXXXXXXXXX.
          </p>
        </div>
        <div class="center" aria-hidden="true"></div>
      </section>

      <section style="margin-top: 12px">
        <div class="card">
          <form id="contactForm" novalidate>
            <div class="form-row">
              <label class="small">Full name</label>
              <input
                name="name"
                type="text"
                placeholder="Your full name"
                required
              />
            </div>

            <div class="row" style="gap: 12px">
              <div style="flex: 1" class="form-row">
                <label class="small">Class</label>
                <select name="class" required>
                  <option value="">Select</option>
                  <option value="10">Class 10</option>
                  <option value="12">Class 12</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div style="flex: 1" class="form-row">
                <label class="small">Board</label>
                <select name="board" required>
                  <option value="">Select</option>
                  <option>CBSE</option>
                  <option>ICSE</option>
                  <option>State Board</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <label class="small">Phone or Email</label>
              <input
                name="contact"
                type="text"
                placeholder="Phone number or email"
                required
              />
            </div>

            <div class="form-row">
              <label class="small">Message</label>
              <textarea
                name="message"
                placeholder="Tell us about your interests or questions"
                required
              ></textarea>
            </div>

            <div id="formFeedback" class="small" style="display: none"></div>

            <div style="margin-top: 12px">
              <button class="btn" type="submit">Send request</button>
            </div>
          </form>
        </div>
      </section>

      <footer class="site-footer">
        <div class="small">Office address: Kurla, Mumbai, Maharashtra</div>
        <div class="small">
          Email: hello@Golden Career Consuling Institute.example
        </div>
      </footer>
    </main>

    <script src="js/main.js" defer></script>
  </body>
</html>
