<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Construction | Golden Career Consulting</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      h1 {
        font-size: 48px;
        color: #7a5986;
        margin-bottom: 10px;
      }
      p {
        font-size: 20px;
        color: #555;
        max-width: 600px;
        margin-bottom: 30px;
      }
      .logo {
        margin-bottom: 20px;
      }
      .progress {
        width: 250px;
        height: 10px;
        background-color: #ddd;
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .progress-bar {
        width: 70%;
        height: 100%;
        background-color: #85a679;
        animation: progress 2s ease-in-out infinite alternate;
      }
      @keyframes progress {
        from {
          width: 40%;
        }
        to {
          width: 90%;
        }
      }
      a {
        background-color: #85a679;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }
      a:hover {
        background-color: #6f8b5f;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <img
        src="https://careerguidance-gcci.s3.ap-southeast-2.amazonaws.com/assets/logo.png"
        alt="Golden Career Consulting Logo"
        width="120"
      />
    </div>
    <h1>We're Building Something Great!</h1>
    <p>
      Our website is currently under construction. We’re working hard to bring
      you valuable career guidance tools and insights. Please check back soon!
    </p>
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
    <a href="index.html">Return to Home</a>
  </body>
</html>
